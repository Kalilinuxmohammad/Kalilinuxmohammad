    <path d="M20 14 V42 M20 14 L38 18 L20 24" fill="none" stroke="#4f8dff" stroke-width="2" stroke-linejoin="round"/>
    <text x="54" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#eafffb" letter-spacing="1">CTF</text>
    <text x="54" y="42" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5f9088" letter-spacing="0.5">ENUMERATION · LOGIC</text>
  </g>

  <g stroke="#1c4a52" stroke-width="1.6" fill="none">
    <path d="M296 233H520V300"/>
    <path d="M1304 233H1080V300"/>
    <path d="M296 420H520V360"/>
    <path d="M1304 420H1080V360"/>
  </g>
  <circle r="4" fill="#00e5c7" filter="url(#glowSm)"><animateMotion dur="3s" repeatCount="indefinite" path="M296 233H520V300"/></circle>
  <circle r="4" fill="#4f8dff" filter="url(#glowSm)"><animateMotion dur="3.4s" repeatCount="indefinite" path="M1304 233H1080V300"/></circle>
  <circle r="4" fill="#00e5c7" filter="url(#glowSm)"><animateMotion dur="2.7s" repeatCount="indefinite" path="M296 420H520V360"/></circle>
  <circle r="4" fill="#4f8dff" filter="url(#glowSm)"><animateMotion dur="3.6s" repeatCount="indefinite" path="M1304 420H1080V360"/></circle>

  <g transform="translate(800,326)">
