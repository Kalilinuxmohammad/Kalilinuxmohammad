<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0a0512"/>
      <stop offset="60%" stop-color="#04030a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="cyanMag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00fff2"/>
      <stop offset="100%" stop-color="#ff2fd0"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="1600" height="650" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
  <rect width="1600" height="650" fill="url(#bgGlow)"/>

  <!-- matrix rain columns -->
  <g font-family="'Courier New',monospace" font-size="20" fill="#00ff9d" opacity="0.35">
    <text x="40"><animate attributeName="y" values="-40;690" dur="4.1s" begin="0s" repeatCount="indefinite"/>01アｱ0</text>
    <text x="90"><animate attributeName="y" values="-40;690" dur="3.4s" begin="0.6s" repeatCount="indefinite"/>ｶ1ﾃ01</text>
    <text x="140"><animate attributeName="y" values="-40;690" dur="5.2s" begin="1.1s" repeatCount="indefinite"/>0ｱ10ﾃ</text>
    <text x="1480"><animate attributeName="y" values="-40;690" dur="3.9s" begin="0.3s" repeatCount="indefinite"/>1ｶ01ｱ</text>
    <text x="1520"><animate attributeName="y" values="-40;690" dur="4.6s" begin="0.9s" repeatCount="indefinite"/>ﾃ010ｱ</text>
    <text x="1560"><animate attributeName="y" values="-40;690" dur="3.1s" begin="1.4s" repeatCount="indefinite"/>01ｶﾃ1</text>
    <text x="200"><animate attributeName="y" values="-40;690" dur="4.8s" begin="1.8s" repeatCount="indefinite"/>ｱ0110</text>
    <text x="1420"><animate attributeName="y" values="-40;690" dur="4.3s" begin="2.1s" repeatCount="indefinite"/>10ﾃｱ0</text>
  </g>

  <!-- hex grid backdrop -->
  <g stroke="#3a1a4a" stroke-width="1" opacity="0.35">
    <path d="M0 100H1600M0 200H1600M0 400H1600M0 500H1600" />
    <path d="M200 0V650M400 0V650M1200 0V650M1400 0V650" />
  </g>

  <!-- outer frame -->
  <rect x="6" y="6" width="1588" height="638" rx="10" fill="none" stroke="url(#cyanMag)" stroke-width="2" opacity="0.8"/>

  <!-- top bar -->
  <text x="40" y="52" font-family="'Courier New',monospace" font-size="22" fill="#00fff2" filter="url(#glowSm)">root@MA:~$ whoami_<tspan opacity="1"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>▌</tspan></text>

  <g transform="translate(1560,44)">
    <circle r="6" fill="#ff2fd0"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
  </g>
  <text x="1540" y="50" font-family="'Courier New',monospace" font-size="16" fill="#ff77e6" text-anchor="end" letter-spacing="2">STATUS: ONLINE</text>

  <line x1="40" y1="66" x2="1560" y2="66" stroke="url(#cyanMag)" stroke-width="1.5" opacity="0.6"/>

  <!-- left tags -->
  <g font-family="'Courier New',monospace" font-size="20" font-weight="bold" fill="#e8fffb">
    <text x="60" y="230">[ LINUX ]</text>
    <text x="60" y="430">[ SECURITY ]</text>
  </g>
  <g font-family="'Courier New',monospace" font-size="20" font-weight="bold" fill="#e8fffb" text-anchor="end">
    <text x="1540" y="230">[ NETWORK ]</text>
    <text x="1540" y="430">[ CTF ]</text>
  </g>

  <!-- connector lines to hex -->
  <g stroke="url(#cyanMag)" stroke-width="2" opacity="0.75" fill="none">
    <path d="M215 222H470V300"/>
    <path d="M1385 222H1130V300"/>
    <path d="M215 422H470V360"/>
    <path d="M1385 422H1130V360"/>
  </g>
  <circle r="5" fill="#00fff2" filter="url(#glowSm)"><animateMotion dur="2.3s" repeatCount="indefinite" path="M215 222H470V300"/></circle>
  <circle r="5" fill="#ff2fd0" filter="url(#glowSm)"><animateMotion dur="2.7s" repeatCount="indefinite" path="M1385 222H1130V300"/></circle>
  <circle r="5" fill="#00fff2" filter="url(#glowSm)"><animateMotion dur="2.1s" repeatCount="indefinite" path="M215 422H470V360"/></circle>
  <circle r="5" fill="#ff2fd0" filter="url(#glowSm)"><animateMotion dur="2.9s" repeatCount="indefinite" path="M1385 422H1130V360"/></circle>

  <!-- central hexagon -->
  <g transform="translate(800,330)">
    <polygon points="0,-175 152,-87 152,87 0,175 -152,87 -152,-87" fill="none" stroke="#3a1a4a" stroke-width="2" stroke-dasharray="6 8" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,-140 121,-70 121,70 0,140 -121,70 -121,-70" fill="none" stroke="url(#cyanMag)" stroke-width="2.5" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,-110 95,-55 95,55 0,110 -95,55 -95,-55" fill="#05030a" stroke="#00fff2" stroke-width="1.5" opacity="0.9"/>

    <!-- glitch M.A text: magenta + cyan offsets -->
    <text x="-3" y="8" font-family="Arial Black, sans-serif" font-size="88" font-weight="900" fill="#ff2fd0" text-anchor="middle" opacity="0.75">
      <animate attributeName="x" values="-3;-9;-3;2;-3" dur="3.3s" repeatCount="indefinite"/>
      MA
    </text>
    <text x="3" y="8" font-family="Arial Black, sans-serif" font-size="88" font-weight="900" fill="#00fff2" text-anchor="middle" opacity="0.75">
      <animate attributeName="x" values="3;8;3;-2;3" dur="2.9s" repeatCount="indefinite"/>
      MA
    </text>
    <text x="0" y="8" font-family="Arial Black, sans-serif" font-size="88" font-weight="900" fill="#f5fffd" text-anchor="middle">
      MA
      <animate attributeName="opacity" values="1;1;0.4;1;1" dur="4s" repeatCount="indefinite"/>
    </text>

    <text x="0" y="45" font-family="'Courier New',monospace" font-size="16" fill="#d9c9ff" text-anchor="middle" letter-spacing="3">MOHAMMAD AMIN</text>
  </g>

  <!-- bottom tagline -->
  <text x="800" y="580" font-family="'Courier New',monospace" font-size="28" font-weight="bold" fill="#f5fffd" text-anchor="middle" letter-spacing="4" filter="url(#glowSm)">CYBERSECURITY STUDENT</text>
  <g>
    <text x="800" y="610" font-family="'Courier New',monospace" font-size="16" fill="#c98bff" text-anchor="middle" letter-spacing="2">
      <animate attributeName="opacity" values="1;1;1;1" dur="1s" repeatCount="indefinite"/>
      LEARN → BUILD → BREAK → ANALYZE → IMPROVE
    </text>
  </g>
  <line x1="600" y1="592" x2="1000" y2="592" stroke="url(#cyanMag)" stroke-width="1.5" opacity="0.7">
    <animate attributeName="x1" values="800;600;800" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="800;1000;800" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- scanline overlay -->
  <rect x="0" y="0" width="1600" height="4" fill="#00fff2" opacity="0.15">
    <animate attributeName="y" values="0;650;0" dur="5s" repeatCount="indefinite"/>
  </rect>
  </g>
</svg>
