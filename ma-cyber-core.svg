  <line x1="700" y1="556" x2="900" y2="556" stroke="url(#accent)" stroke-width="1.4" opacity="0.7"/>
  <text x="800" y="584" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#eefffc" text-anchor="middle" letter-spacing="4">CYBERSECURITY STUDENT</text>
  <text x="800" y="610" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5f9088" text-anchor="middle" letter-spacing="2">LEARN &#8594; BUILD &#8594; ANALYZE &#8594; SECURE</text>

  <rect x="0" y="0" width="1600" height="2" fill="#00e5c7" opacity="0.12">
    <animate attributeName="y" values="0;650;0" dur="9s" repeatCount="indefinite"/>
  </rect>
