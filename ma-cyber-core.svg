<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop stop-color="#020305"/><stop offset=".5" stop-color="#06110e"/><stop offset="1" stop-color="#010202"/>
</linearGradient>
<radialGradient id="glow">
<stop stop-color="#00ffb3" stop-opacity=".38"/><stop offset=".55" stop-color="#00ffb3" stop-opacity=".06"/><stop offset="1" stop-color="#00ffb3" stop-opacity="0"/>
</radialGradient>
<linearGradient id="electric">
<stop stop-color="#00ffb3"/><stop offset=".55" stop-color="#62ffe5"/><stop offset="1" stop-color="#54ddff"/>
</linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="15"/></filter>
<filter id="neon"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#8affdf" stroke-opacity=".045"/>
</pattern>
</defs>

<rect width="1600" height="650" rx="32" fill="url(#bg)"/>
<rect x="18" y="18" width="1564" height="614" rx="26" fill="url(#grid)" stroke="#8affdf" stroke-opacity=".13"/>
<circle cx="800" cy="320" r="320" fill="url(#glow)" filter="url(#blur)">
<animate attributeName="r" values="285;330;285" dur="5s" repeatCount="indefinite"/>
</circle>

<!-- rotating outer systems -->
<g fill="none" stroke="url(#electric)" transform-origin="800 320">
<circle cx="800" cy="320" r="230" stroke-opacity=".12"/>
<circle cx="800" cy="320" r="185" stroke-opacity=".2"/>
<circle cx="800" cy="320" r="140" stroke-opacity=".32"/>
<circle cx="800" cy="320" r="100" stroke-opacity=".5"/>
<circle cx="800" cy="320" r="260" stroke-opacity=".28" stroke-dasharray="3 16">
<animateTransform attributeName="transform" type="rotate" from="0 800 320" to="360 800 320" dur="28s" repeatCount="indefinite"/>
</circle>
<circle cx="800" cy="320" r="210" stroke="#00eaff" stroke-opacity=".18" stroke-dasharray="1 20">
<animateTransform attributeName="transform" type="rotate" from="360 800 320" to="0 800 320" dur="17s" repeatCount="indefinite"/>
</circle>
</g>

<!-- circuit network -->
<g fill="none" stroke="url(#electric)" stroke-width="2" stroke-linecap="round">
<path d="M700 320H470V210H180"/>
<path d="M900 320h230V210h290"/>
<path d="M700 320H470V430H180"/>
<path d="M900 320h230V430h290"/>
<path d="M800 220V135"/>
<path d="M800 420v95"/>
</g>

<!-- animated data pulses -->
<g fill="#00ffb3" filter="url(#neon)">
<circle r="5"><animateMotion dur="2.6s" repeatCount="indefinite" path="M700 320H470V210H180"/></circle>
<circle r="5"><animateMotion dur="2.9s" repeatCount="indefinite" path="M900 320h230V210h290"/></circle>
<circle r="5"><animateMotion dur="2.4s" repeatCount="indefinite" path="M700 320H470V430H180"/></circle>
<circle r="5"><animateMotion dur="3.1s" repeatCount="indefinite" path="M900 320h230V430h290"/></circle>
</g>

<!-- nodes -->
<g fill="#00ffb3" filter="url(#neon)">
<circle cx="180" cy="210" r="5"/><circle cx="1420" cy="210" r="5"/>
<circle cx="180" cy="430" r="5"/><circle cx="1420" cy="430" r="5"/>
<circle cx="800" cy="135" r="5"/><circle cx="800" cy="515" r="5"/>
</g>

<!-- header -->
<g font-family="monospace">
<text x="70" y="78" fill="#00ffb3" font-size="13" letter-spacing="5">MA // CYBER IDENTITY</text>
<text x="1530" y="78" text-anchor="end" fill="#718d85" font-size="11" letter-spacing="3">NODE 0001 / ONLINE</text>
<text x="1530" y="104" text-anchor="end" fill="#00ffb3" font-size="11">● SIGNAL STABLE</text>
</g>

<!-- modules -->
<g font-family="monospace">
<text x="120" y="198" fill="#00ffb3" font-size="12" letter-spacing="4">SECURITY</text>
<text x="120" y="223" fill="#67847c" font-size="10">WEB / RECON / LABS</text>
<text x="120" y="418" fill="#00ffb3" font-size="12" letter-spacing="4">LINUX</text>
<text x="120" y="443" fill="#67847c" font-size="10">KALI / BASH / CLI</text>

<text x="1480" y="198" text-anchor="end" fill="#00ffb3" font-size="12" letter-spacing="4">NETWORK</text>
<text x="1480" y="223" text-anchor="end" fill="#67847c" font-size="10">TCP/IP / CISCO / TRAFFIC</text>
<text x="1480" y="418" text-anchor="end" fill="#00ffb3" font-size="12" letter-spacing="4">CTF</text>
<text x="1480" y="443" text-anchor="end" fill="#67847c" font-size="10">ENUMERATION / ANALYSIS</text>
</g>

<!-- central MA core -->
<circle cx="800" cy="320" r="82" fill="#010504" stroke="url(#electric)" stroke-width="2" filter="url(#neon)"/>
<circle cx="800" cy="320" r="67" fill="none" stroke="#00ffb3" stroke-opacity=".28" stroke-dasharray="3 9">
<animateTransform attributeName="transform" type="rotate" from="0 800 320" to="360 800 320" dur="10s" repeatCount="indefinite"/>
</circle>
<circle cx="800" cy="320" r="92" fill="none" stroke="#54ddff" stroke-opacity=".16" stroke-dasharray="2 18">
<animateTransform attributeName="transform" type="rotate" from="360 800 320" to="0 800 320" dur="7s" repeatCount="indefinite"/>
</circle>

<g font-family="monospace" text-anchor="middle">
<text x="800" y="337" fill="#eafff7" font-size="82" font-weight="700" letter-spacing="8" filter="url(#neon)">MA
<animate attributeName="opacity" values=".75;1;.75" dur="2.2s" repeatCount="indefinite"/>
</text>
<text x="800" y="372" fill="#00ffb3" font-size="10" letter-spacing="5">MOHAMMAD AMIN</text>
</g>

<!-- footer -->
<g font-family="monospace" text-anchor="middle">
<text x="800" y="566" fill="#d8fff3" font-size="12" letter-spacing="5">CYBERSECURITY STUDENT</text>
<text x="800" y="593" fill="#6b8880" font-size="10" letter-spacing="3">LEARN → BUILD → BREAK → ANALYZE → IMPROVE</text>
</g>

<!-- scanline -->
<rect x="30" y="30" width="1540" height="2" fill="#00ffb3" opacity=".3">
<animate attributeName="y" values="30;610;30" dur="8s" repeatCount="indefinite"/>
</rect>
</svg>