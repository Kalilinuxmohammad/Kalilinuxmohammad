    </circle>
  </g>
  <text x="1488" y="63" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#7fd9cc" text-anchor="end" letter-spacing="2">ONLINE</text>

  <line x1="52" y1="88" x2="1548" y2="88" stroke="#123044" stroke-width="1.2"/>

  <g transform="translate(120,205)">
    <rect x="0" y="0" width="176" height="56" rx="28" fill="#081420" stroke="#1c4a52" stroke-width="1.4"/>
    <circle cx="28" cy="28" r="12" fill="none" stroke="#00e5c7" stroke-width="2"/>
    <text x="28" y="33" font-family="Helvetica, Arial" font-size="14" fill="#00e5c7" text-anchor="middle" font-weight="700">Lx</text>
    <text x="54" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#eafffb" letter-spacing="1">LINUX</text>
    <text x="54" y="42" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5f9088" letter-spacing="0.5">KALI · BASH · CLI</text>
