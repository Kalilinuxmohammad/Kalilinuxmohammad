    <circle r="128" fill="none" stroke="#00e5c7" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="122;134;122" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.15;0.45" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="104" fill="#040c14" stroke="url(#accent)" stroke-width="2.4" filter="url(#glow)"/>
    <circle r="104" fill="none" stroke="#0d2430" stroke-width="1"/>
    <text x="0" y="16" font-family="Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="#eefffc" text-anchor="middle" letter-spacing="1">
