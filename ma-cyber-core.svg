<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#0a1420"/>
      <stop offset="60%" stop-color="#050b12"/>
      <stop offset="100%" stop-color="#02060a"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5c7"/>
      <stop offset="100%" stop-color="#4f8dff"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5c7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#4f8dff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00e5c7" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#123044"/>
    </pattern>
  </defs>

  <rect width="1600" height="650" rx="16" fill="url(#bg)"/>
  <rect width="1600" height="650" rx="16" fill="url(#dots)" opacity="0.6"/>
  <rect x="3" y="3" width="1594" height="644" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.6"/>

  <text x="52" y="66" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#dff7f1" letter-spacing="3">MA</text>
  <text x="90" y="66" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6fa6a0" letter-spacing="2">/ CYBERSECURITY IDENTITY</text>

  <g transform="translate(1500,58)">
    <circle r="4.5" fill="#00e5c7">
